name=cdc-products
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1
database.hostname=127.0.0.1
database.port=55438
database.user=cdc
database.password=cdc_local_only
database.dbname=cdc_demo
topic.prefix=cdc
plugin.name=pgoutput
slot.name=cdc_products_slot
publication.name=cdc_products_publication
publication.autocreate.mode=disabled
table.include.list=public.products
snapshot.mode=initial
# Deliver TRUNCATE too, so consumer.py can reject it instead of silently keeping stale keys.
skipped.operations=none
tombstones.on.delete=true
heartbeat.interval.ms=5000
